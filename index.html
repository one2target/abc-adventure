const actions={'parent-view':renderParentView,'gate-retry':()=>{$('#gate-message').textContent='Попробуйте ещё раз.';},start:begin,next:nextLessonStep,repeat:()=>{unlockAudio();const focus=$('#audio-focus');if(focus){focus.classList.remove('pulsing');void focus.offsetWidth;focus.classList.add('pulsing');}repeatInstruction();},'after-letter':advanceAfterLetter,'play-mini':()=>startGame(false),'play-final':()=>startGame(true),'after-mini':advanceAfterMini,reset:showReset,'confirm-reset':resetProgress,'close-modal':closeModal,progress:openProgress,back:()=>go(lastView),replay:()=>{AppState.cursor.phase='finalIntro';AppState.question=null;go('course');},'demo-next':()=>{if(!DEMO)return;if(view==='home')begin();else if(view==='progress')go(lastView);else{const c=AppState.cursor;if(c.phase==='lesson'){if(c.step<2)nextLessonStep();else checkAnswer(document.querySelector(`[data-answer="${AppState.question.letter}"]`));}else if(['mini','final'].includes(c.phase))checkAnswer(document.querySelector(`[data-answer="${AppState.question.letter}"]`));else if(c.phase==='letterReward')advanceAfterLetter();else if(c.phase==='miniIntro')startGame();else if(c.phase==='miniResult')advanceAfterMini();else if(c.phase==='finalIntro')startGame(true);else actions.replay();}}};
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.hasAttribute('data-answer'))checkAnswer(button);else if(actions[button.dataset.action])actions[button.dataset.action]();});
document.addEventListener('keydown',event=>{const layer=$('#modal-layer');if(layer.hidden)return;if(event.key==='Escape'){event.preventDefault();closeModal();}if(event.key==='Tab'){const buttons=[...layer.querySelectorAll('button:not(:disabled)')];const first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAudio();cancelHold();saveProgress();}});window.addEventListener('pagehide',()=>{stopAudio();saveProgress();});
// Do not play sound on load; opening the file always presents START / CONTINUE.
showScreen();
